<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPR - Champion Rush Calculator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(rgba(5,5,20,.82),rgba(5,5,20,.88)),
url('luxubu-lineup.png');
background-size:cover;
background-position:center;
color:white;
padding:20px;
}
.container{
width:480px;
background:rgba(15,15,30,.78);
backdrop-filter:blur(12px);
border:1px solid rgba(168,85,247,.4);
border-radius:24px;
padding:25px;
box-shadow:0 0 25px rgba(168,85,247,.4);
}
.header{text-align:center;margin-bottom:20px}
.header img{width:90px;margin-bottom:10px}
.header h1{color:#fff}
.header p{color:#c084fc}
select,input{
width:100%;height:56px;margin:10px 0;border:none;
border-radius:12px;padding:0 15px;font-size:18px;
}
button{
width:100%;height:56px;border:none;border-radius:12px;
background:linear-gradient(135deg,#7e22ce,#c026d3);
color:#fff;font-size:20px;font-weight:bold;cursor:pointer;
}
.matches{margin-top:15px;max-height:220px;overflow:auto}
.match{
background:#1e1b4b;padding:12px;border-left:4px solid #c026d3;
border-radius:10px;margin-bottom:8px;
}
.total{
margin-top:15px;text-align:center;padding:15px;
background:linear-gradient(135deg,#9333ea,#06b6d4);
border-radius:12px;font-size:32px;font-weight:bold;
}
</style>
</head>
<body>
<div class="container">
<div class="header">
<img src="luxubu-logo.png" alt="Luxubu Logo">
<h1>🏆 Champion Rush</h1>
<p>Luxubu Esport Calculator</p>
</div>

<select id="rank">
<option value="1">Hạng 1</option><option value="2">Hạng 2</option>
<option value="3">Hạng 3</option><option value="4">Hạng 4</option>
<option value="5">Hạng 5</option><option value="6">Hạng 6</option>
<option value="7">Hạng 7</option><option value="8">Hạng 8</option>
<option value="9">Hạng 9</option><option value="10">Hạng 10</option>
<option value="11">Hạng 11</option><option value="12">Hạng 12</option>
</select>

<input type="number" id="kills" placeholder=" Số kill">
<button onclick="addMatch()"> Thêm trận</button>

<div class="matches" id="matches"></div>
<div class="total" id="total">0</div>
</div>

<script>
const pts={1:12,2:9,3:8,4:7,5:6,6:5,7:4,8:3,9:2,10:1,11:0,12:0};
let total=0,m=0;
function addMatch(){
const r=+rank.value;
const k=+kills.value||0;
const s=pts[r]+k;
total+=s;m++;
matches.innerHTML=`<div class="match">Trận ${m} | Hạng ${r} | Kill ${k} | Điểm ${s}</div>`+matches.innerHTML;
document.getElementById('total').innerText=total;
kills.value='';
}
</script>
</body>
</html>
